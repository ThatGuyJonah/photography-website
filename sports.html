<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sports Photography | Jonah Cox Photography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sports.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <img src="images/jonah-cox-logo.png" alt="Jonah Cox Photography">
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT ME</a></li>
                    <li><a href="portfolio.html">PORTFOLIO</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main>

        <!-- HERO IMAGE -->
        <section class="sports-hero">
            <h1>SPORTS PHOTOGRAPHY</h1>
        </section>

        <!-- PHOTO GALLERY -->
        <section class="sports-gallery">

            <div class="sports-gallery-grid">

                <img src="images/sports/sports-2.jpg" alt="Sports photography">
                <img src="images/sports/sports-3.jpg" alt="Sports photography">
				<img src="images/sports/sports-4.jpg" alt="Sports photography">
				<img src="images/sports/sports-5.jpg" alt="Sports photography">
				<img src="images/sports/sports-6.jpg" alt="Sports photography">
				<img src="images/sports/sports-7.jpg" alt="Sports photography">
				<img src="images/sports/sports-8.jpg" alt="Sports photography">
				<img src="images/sports/sports-9.jpg" alt="Sports photography">

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-content">
            <div class="footer-links">
                <a href="index.html">HOME</a>
                <a href="about.html">ABOUT ME</a>
                <a href="portfolio.html">PORTFOLIO</a>
                <a href="contact.html">CONTACT</a>
            </div>
        </div>

        <div class="footer-bottom">
            <p>© 2026 Jonah Cox Photography. All rights reserved.</p>
        </div>

    </footer>

    <!-- IMAGE LIGHTBOX -->
    <div class="lightbox" id="lightbox">

        <button class="lightbox-close" id="lightbox-close" aria-label="Close image">
            &times;
        </button>

        <img src="" alt="" id="lightbox-image">

    </div>

    <script>
        const galleryImages = document.querySelectorAll(".sports-gallery-grid img");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");
        const closeButton = document.getElementById("lightbox-close");

        galleryImages.forEach(image => {
            image.addEventListener("click", () => {
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt;
                lightbox.classList.add("active");
                document.body.style.overflow = "hidden";
            });
        });

        function closeLightbox() {
            lightbox.classList.remove("active");
            document.body.style.overflow = "";
            lightboxImage.src = "";
        }

        closeButton.addEventListener("click", closeLightbox);

        lightbox.addEventListener("click", event => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
